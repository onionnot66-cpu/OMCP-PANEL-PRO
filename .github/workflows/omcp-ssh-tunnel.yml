name: OMCP reverse SSH tunnel checks
on:
  push:
    branches: [main]
    paths:
      - 'connector/tunnel.go'
      - 'scripts/omcp-ssh-tunnel-smoke.sh'
      - '.github/workflows/omcp-ssh-tunnel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: OpenSSH server
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
      - name: Verify real loopback reverse forwarding and reconnect
        run: |
          bash -n scripts/omcp-ssh-tunnel-smoke.sh
          bash scripts/omcp-ssh-tunnel-smoke.sh
