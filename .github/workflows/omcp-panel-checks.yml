name: OMCP panel smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/**'
      - 'public/**'
      - 'tests/**'
      - 'composer.*'
      - 'package.json'
      - 'yarn.lock'
      - 'omcp-ui-test-install.sh'
      - '.github/workflows/omcp-panel-checks.yml'
  workflow_dispatch:
concurrency:
  group: omcp-panel-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: omcp_ci_only
          MYSQL_DATABASE: omcp_test_ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_NAME: OMCP
      APP_ENVIRONMENT_ONLY: 'true'
      APP_URL: http://127.0.0.1:8080
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: omcp_test_ci
      DB_USERNAME: root
      DB_PASSWORD: omcp_ci_only
      CACHE_DRIVER: array
      CACHE_STORE: array
      SESSION_DRIVER: file
      APP_2FA_REQUIRED: '0'
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      RECAPTCHA_ENABLED: 'false'
      PTERODACTYL_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, posix, zip, bcmath, curl, dom, xml
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP dependencies
        id: php-deps
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-scripts
          export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"
          php artisan package:discover --ansi
      - name: Connector integration tests
        run: vendor/bin/phpunit tests/Integration/Omcp
      - name: Frontend build
        id: frontend
        if: ${{ !cancelled() }}
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
          NODE_OPTIONS=--max-old-space-size=4096 yarn build:production
          test -s public/assets/manifest.json
      - name: Install, login and ownership smoke checks
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          bash -n omcp-ui-test-install.sh
          test "$DB_DATABASE" = omcp_test_ci
          php artisan migrate:fresh --seed --force
          php artisan route:list --path=api/omcp/v1
          umask 077
          export OMCP_SMOKE_PASSWORD="$(php -r 'echo bin2hex(random_bytes(24));')"
          echo "::add-mask::$OMCP_SMOKE_PASSWORD"
          export OMCP_SMOKE_FIXTURE="$(mktemp)"
          php tests/Smoke/seed.php > "$OMCP_SMOKE_FIXTURE"
          APP_ENV=local CACHE_STORE=file SESSION_DRIVER=file php artisan serve --host=127.0.0.1 --port=8080 > /tmp/omcp-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f "$OMCP_SMOKE_FIXTURE"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:8080/auth/login -o /tmp/omcp-login.html
          grep -q 'OMCP' /tmp/omcp-login.html
          python3 tests/Smoke/http_smoke.py
      - name: Upload build assets
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: omcp-panel-assets
          path: public/assets/
