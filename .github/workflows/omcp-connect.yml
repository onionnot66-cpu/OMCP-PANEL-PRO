name: OMCP Connect checks
on:
  push:
    paths:
      - 'connector/**'
      - 'tests/Smoke/rootless-fleet.sh'
      - 'tests/Smoke/runtime-probe/**'
      - 'omcp-connect-install.sh'
      - '.github/workflows/omcp-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n ../omcp-connect-install.sh
      - run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/omcp-connect-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/omcp-connect-linux-arm64 .
          (cd dist && sha256sum omcp-connect-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: omcp-connect-linux
          path: connector/dist/
  rootless-fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Prepare the runner user service manager
        run: |
          unit="user@$(id -u).service"
          sudo mkdir -p "/etc/systemd/system/$unit.d"
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee "/etc/systemd/system/$unit.d/delegate.conf"
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER"
          sudo systemctl restart "$unit"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Start rootless Docker
        if: matrix.engine == 'docker'
        run: |
          curl --proto '=https' -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/docker.asc"
          sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/omcp-ci-docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/omcp-ci-docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/omcp-ci-docker.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends docker-ce-rootless-extras uidmap slirp4netns
          dockerd-rootless-setuptool.sh install --force
      - name: Exercise two isolated fixture processes
        run: systemd-run --user --scope -p Delegate=yes env PATH="$PATH" bash tests/Smoke/rootless-fleet.sh "${{ matrix.engine }}"
